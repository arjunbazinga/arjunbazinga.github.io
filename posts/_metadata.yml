# options specified here will apply to all posts in this folder

# freeze computational output
# (see https://quarto.org/docs/projects/code-execution.html#freeze)
freeze: true

# Reading typography and measure for essays (the Writing index has its own layout).
body-classes: essay-page

# Enable banner style title blocks
title-block-banner: false



# Default for table of contents
toc: true
toc-title: On this page
toc-location: left

# Default knitr options
execute:
  echo: true
  message: true
  warning: true

# Default author
# author:
#   - name: Arjun Srivastava
#     url: https://arjunsriva.com
#     orcid: 0000-0003-4303-9098



# Enable CC licence appendix
# license: "CC BY"

# Default fields for citation
# citation: false


