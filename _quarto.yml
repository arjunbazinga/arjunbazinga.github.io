project:
  type: website
  render:
    - "*.qmd"
    - "posts/**"
    - "podcast/**"
    - "til/**"
    - "archive/**"
    - "album/**"
    - "!drafts/**"
    - "!scripts/**"
    - "!.claude/**"
  resources:
    - static/fonts/**
    - static/research-previews/**
    - static/reading-tools.js
    - static/album/**
    - static/charmera/**
    - static/profile-352.webp
    - static/social-card.png
  preview:
    port: 4200
    browser: true

website:
  title: "Arjun Srivastava"
  site-url: "https://www.arjunsriva.com"
  site-path: '/'
  draft-mode: "unlinked"
  navbar:
    right:
      - text: Writing
        href: /posts/
      - text: Library
        href: https://www.arjunsriva.com/library/
      - text: Podcast
        href: /podcast/
      - text: Album
        href: /album/
      - text: About
        href: /about.html
  page-footer:
    left: "Arjun Srivastava · Tokyo"
    right:
      - text: Subscribe
        href: https://arjunsriva.substack.com/
      - text: Writing RSS
        href: /index.xml
      - text: GitHub
        href: https://github.com/arjunbazinga
  favicon: favicon.ico
  image: /static/social-card.png
  image-alt: "Arjun Srivastava. I build and write about AI, software, and complex systems."
  twitter-card: true
  open-graph: true

format:
  html:
    canonical-url: true
    include-in-header:
      text: |
        <link rel="preload" href="/static/fonts/source-serif-4-latin.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="preload" href="/static/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="preload" href="/static/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin>
    include-after-body:
      text: '<script src="/static/reading-tools.js" defer></script>'
    theme:
      light: [default, theme/light.scss]
      dark: [default, theme/dark.scss]
    css: styles.css
    highlight-style:
      light: github-light
      dark: github-dark
filters:
  - _includes/reading-layout.lua
